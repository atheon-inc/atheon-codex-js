name: Build and Publish to NPM Registry

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install and Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build JS package
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-dist-artifact
          path: ./dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-metadata-artifact
          path: |
            package.json
            README.md
            License.md

  publish-package:
    needs: build-package
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: release-dist-artifact
          path: ./dist

      - name: Download metadata artifact
        uses: actions/download-artifact@v8
        with:
          name: release-metadata-artifact
          path: .

      - name: Install and Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          registry-url: "https://registry.npmjs.org"

      # Pin the global npm to the 11.x line. npm@latest now resolves to 12.0.0,
      # which (a) has a broken provenance path (missing bundled 'sigstore',
      # npm/cli#9722) and (b) hard-blocks dependency install scripts by default.
      # 11.x is OIDC/provenance-capable (>= 11.5.1) and only warns on scripts.
      - name: Update npm to latest
        run: npm install -g npm@11

      - name: Publish to npm via OIDC
        run: npm publish --ignore-scripts
